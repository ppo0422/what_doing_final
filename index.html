<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What are you doing? 꾸미기 미션</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E6;--ink:#2B2A33;--sub:#6E6A78;--accent:#FF7A59;--accent2:#5B8DEF;--good:#22A562;--bad:#E5484D;--line:#EBDDC4;--gold:#F5B700;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Jua',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.en{font-family:'Andika','Trebuchet MS',sans-serif;font-weight:700;letter-spacing:.01em}
#app{max-width:1000px;margin:0 auto;padding:12px 14px 48px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;border-radius:16px;font-size:20px;padding:12px 20px;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
button.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
button.blue{background:var(--accent2)}
button.green{background:var(--good)}
button.small{font-size:16px;padding:8px 12px;border-radius:12px}
button:disabled{opacity:.4;cursor:default;transform:none}
h1,h2,h3{margin:.2em 0;font-weight:400}
.topbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:6px 10px;border:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.topbar .mini{width:46px;height:58px;border-radius:12px;overflow:hidden;background:#FFF0D6}
.topbar .mini svg{width:100%;height:100%}
.coins{font-size:22px;background:#FFF4C2;border-radius:999px;padding:4px 14px;border:2px solid #F5D66B}
.spacer{flex:1}
.panel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px}
.center{text-align:center}
.muted{color:var(--sub)}
.avatar{display:block}
.av-wrap{background:radial-gradient(circle at 50% 40%,#FFFFFF,#FFE9C7);border-radius:24px;overflow:hidden;border:3px solid var(--line)}
/* start */
.title{font-size:clamp(34px,6vw,56px);color:var(--accent);text-align:center;line-height:1.1}
.hero-pick{display:flex;gap:16px;justify-content:center;margin:14px 0}
.hero-pick button{background:#fff;border:4px solid var(--line);padding:6px;width:150px;color:var(--ink)}
.hero-pick button.on{border-color:var(--accent);background:#FFF1EC}
.hero-pick svg{width:100%;height:170px}
input.name{font-family:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);width:min(320px,90%);text-align:center}
/* map */
.home{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px}
@media (max-width:720px){.home{grid-template-columns:1fr}}
.home-av svg{width:100%;height:auto;max-height:380px}
.stage-node{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;border:2px solid var(--line);background:#fff;margin-bottom:8px}
.stage-node .sicon{font-size:32px;width:44px;text-align:center}
.stage-node small{display:block;color:var(--sub);font-size:15px}
.stage-node.now{border-color:var(--accent);background:#FFF1EC;box-shadow:0 0 0 4px #FFD8CB}
.stage-node.lock{opacity:.55}
.stage-node.done{background:#EEFAF3;border-color:#BDE8CF}
.stage-node .grow{flex:1}
/* play */
.stagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.stagehead .st{font-size:24px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#E9DFCF;display:inline-block}
.dots i.d{background:var(--good)}
.dots i.c{background:var(--accent);box-shadow:0 0 0 3px #FFD8CB}
.inst{font-size:22px;margin:6px 0 12px}
.listen-row{display:flex;gap:10px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap}
.big-sound{font-size:26px;padding:14px 28px;background:var(--accent2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.card{background:#fff;border:4px solid var(--line);border-radius:22px;font-size:66px;padding:16px 6px;color:var(--ink);box-shadow:0 5px 0 #E6D6BA;line-height:1.1}
.card .lab{display:block;font-size:17px;margin-top:6px;color:var(--sub)}
.card.right{border-color:var(--good);background:#E6F8EE;box-shadow:0 5px 0 #A8DDBF}
.card.wrong{border-color:var(--bad);opacity:.45;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.sentence{font-size:clamp(26px,4.6vw,42px);text-align:center;margin:10px 0;line-height:1.5}
.qbox{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;background:#FFFDF8;border:2px dashed var(--line);border-radius:22px;padding:12px;margin-bottom:6px}
.pic{font-size:72px;line-height:1;position:relative;display:inline-flex;align-items:center;gap:6px}
.pic .who{font-size:44px}
.pic .qm{position:absolute;top:-14px;right:-18px;font-size:30px;background:#FFE36E;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-family:'Andika',sans-serif;font-weight:700}
.pic-label{font-size:17px;color:var(--sub);text-align:center}
.feedback{margin:16px auto 0;padding:14px 16px;border-radius:18px;font-size:22px;text-align:center;max-width:720px}
.feedback.good{background:#E6F8EE;border:3px solid #A8DDBF}
.feedback.bad{background:#FFF0F0;border:3px solid #F5B5B7}
.feedback.info{background:#EEF3FF;border:3px solid #C3D3FA}
.next-row{text-align:center;margin-top:14px}
.next-row button{font-size:26px;padding:14px 40px}
.answer-line{min-height:74px;border-bottom:4px solid var(--accent2);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px;margin:8px auto 16px;max-width:760px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px}
.tile{font-family:'Andika',sans-serif;font-weight:700;font-size:28px;background:#fff;color:var(--ink);border:3px solid var(--line);padding:8px 16px;box-shadow:0 4px 0 #E6D6BA}
.tile.placed{background:#EEF3FF;border-color:#C3D3FA}
.tile.ok{background:#E6F8EE;border-color:#A8DDBF}
input.blank{font-family:'Andika',sans-serif;font-weight:700;font-size:inherit;width:6.5em;border:none;border-bottom:4px solid var(--accent);background:#FFF5EF;border-radius:8px 8px 0 0;text-align:center;color:var(--ink);padding:0 4px}
input.write{font-family:'Andika',sans-serif;font-weight:700;font-size:30px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);width:100%;max-width:720px;display:block;margin:0 auto}
input:focus{outline:none;border-color:var(--accent2)}
.check-row{text-align:center;margin-top:14px}
.check-row button{font-size:24px;padding:12px 36px}
.hint{font-size:21px;text-align:center;margin-top:10px;color:#7A4F00;min-height:1em}
.hint .en{font-size:28px;letter-spacing:.08em}
.w-ok{color:var(--good)}.w-bad{color:var(--bad);text-decoration:underline wavy}
.chat{display:flex;flex-direction:column;gap:10px;max-width:720px;margin:0 auto 12px}
.bubble{background:#fff;border:3px solid var(--line);border-radius:20px;padding:10px 14px;font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bubble.friend{border-color:#C3D3FA;background:#F3F7FF;align-self:flex-start}
.bubble.me{align-self:flex-end;background:#FFF1EC;border-color:#FFC9B7}
.mic{font-size:28px;padding:16px 36px;border-radius:999px}
.mic.listening{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 14px rgba(229,72,77,0)}}
.heard{font-size:24px;text-align:center;margin-top:10px;min-height:1.4em}
.mode-note{font-size:15px;color:var(--sub);text-align:center;margin-top:8px}
.map-wrap{border-radius:26px;overflow:hidden;border:3px solid #fff;box-shadow:0 10px 0 #E6D6BA,0 14px 30px rgba(90,60,20,.18);background:#E8F7FF}
.map{display:block;width:100%;height:auto}
.stop.now{cursor:pointer}
.stop.now:hover{filter:brightness(1.05)}
.walker{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cloud{animation:drift 26s linear infinite}.cloud.slow{animation-duration:40s}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(160px)}}
.balloon{animation:float 3s ease-in-out infinite}.balloon.b2{animation-delay:.8s}.balloon.b3{animation-delay:1.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.next-card{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #FFC9B7;border-radius:22px;padding:12px 16px;margin-top:16px;box-shadow:0 5px 0 #F3D8CC;flex-wrap:wrap}
.next-card .nc-em{font-size:52px}
.next-card .grow{flex:1;min-width:200px}
.story{background:#FFF7E0;border:2px dashed #F5D66B;border-radius:14px;padding:8px 12px;font-size:18px;margin:4px 0 6px;text-align:center}
.invite{max-width:620px;margin:10px auto 6px;background:linear-gradient(135deg,#FFF0F5,#FFF8E6);border:3px dashed #FF9EB8;border-radius:22px;padding:12px 18px;font-size:19px;line-height:1.6}
.invite .inv-h{font-size:26px;color:#E0457B}
.invite p{margin:6px 0}
/* shop */
.shop{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px}
@media (max-width:720px){.shop{grid-template-columns:1fr}}
.shop .av-wrap svg{width:100%;height:auto;max-height:400px}
.sticky{position:sticky;top:10px;align-self:start}
.tier-h{font-size:20px;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.item{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 6px;text-align:center;color:var(--ink);box-shadow:0 4px 0 #E6D6BA;font-size:16px}
.item .ic{display:block;height:50px;line-height:50px}
.item .ic svg{width:48px;height:48px;vertical-align:middle}
.item .ic .emo{font-size:40px}
.unlock .uic svg{width:30px;height:30px;vertical-align:middle}
.unlock .uic .emo{font-size:24px;font-style:normal}
.shop-timer{font-size:24px;text-align:center;background:#EEF3FF;border:3px solid #C3D3FA;border-radius:16px;padding:6px 10px;margin-bottom:10px}
.shop-timer.hurry{background:#FFF0F0;border-color:#F5B5B7;color:var(--bad);animation:pulse 1s infinite}
.item .pr{display:block;margin-top:2px;color:#9A6B00}
.item.own{border-color:#A8DDBF}
.item.own .pr{color:var(--good)}
.item.on{background:#E6F8EE;border-color:var(--good)}
.item.prev{border-color:var(--accent2);background:#EEF3FF}
.item.locked{opacity:.4}
.shop-msg{min-height:58px;margin-top:10px;text-align:center;font-size:19px}
/* clear / end */
.big-emoji{font-size:84px;text-align:center;line-height:1}
.unlock{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.unlock > span{background:#FFF4C2;border:2px solid #F5D66B;border-radius:14px;padding:6px 10px;font-size:18px}
.cert{max-width:640px;margin:0 auto;border:6px double var(--gold);background:#FFFDF4}
.cert table{width:100%;border-collapse:collapse;font-size:20px;margin-top:10px}
.cert td{padding:8px;border-bottom:2px dashed var(--line)}
.cert td:last-child{text-align:right}
/* check */
.chk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px;border-bottom:2px dashed var(--line);font-size:19px}
.chk .st{font-size:28px;text-align:center}
.chk small{display:block;color:var(--sub);font-size:15px}
/* modal & fx */
.modal-bg{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:22px;padding:22px;max-width:420px;width:100%;text-align:center;font-size:21px}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:16px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.coinfloat{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:40px;color:#B07D00;text-shadow:0 2px 0 #fff;animation:rise 1.2s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,20px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.conf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.twinkle{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.foot{margin-top:18px;text-align:center}
.foot button{margin:4px}

/* ---- v6 additions ---- */
.combo{font-size:18px;color:#E0603F;min-width:90px;text-align:right}
.combo.hot{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.gauge{height:16px;background:#F1E7D6;border-radius:999px;overflow:hidden;margin:4px 0 10px;border:2px solid #EADFCB}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#FF9EB8,#FFC94A,#5EDB8A);border-radius:999px;transition:width .5s}
/* mole */
.mole-field{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
@media (max-width:600px){.mole-field{grid-template-columns:repeat(2,1fr)}}
.hole{position:relative;height:214px;overflow:hidden;border-radius:20px;background:linear-gradient(#DFF5D2,#BFE8A8)}
.hole .dirt{position:absolute;left:4%;right:4%;bottom:4px;height:30px;border-radius:50%;background:#7A5234;box-shadow:inset 0 6px 0 #5A3A22;z-index:0}
.mole{position:absolute;left:5%;right:5%;bottom:-280px;transition:bottom .22s ease-out;z-index:1;cursor:pointer;text-align:center}
.mole.up{bottom:30px}
.mole .mface{font-size:38px;line-height:1}
.mole .msign.pic{flex-direction:column;padding:4px;min-height:0}.mole .msign.pic .mpic{width:112px;height:112px}.mole .msign.pic .mpic svg{width:100%;height:100%}.mole .msign.pic .mtag{font-size:13px;margin-top:0}.mole .mface{font-size:30px}
.mole .msign{background:#fff;border:3px solid #C89B6D;border-radius:12px;padding:8px 6px;font-size:18px;line-height:1.3;min-height:48px;word-break:keep-all;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #C89B6D}
.mole.hit .msign{border-color:var(--bad);background:#FFE9E9}
.mole.bonk .mface{animation:pop .3s}
.mole.bonk .msign{border-color:var(--good);background:#E6F8EE}
/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.mem-grid{grid-template-columns:repeat(3,1fr)}}
.mcard.done .b{border-color:var(--good);background:#E6F8EE}
.mem-stat{display:flex;gap:16px;justify-content:center;font-size:19px;margin:6px 0 10px}
/* comic */
.comic{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px;margin:0 auto 12px}
@media (max-width:600px){.comic{grid-template-columns:1fr}}
.panel-c{background:#FFFDF6;border:3px solid #2B2A33;border-radius:10px;padding:10px;display:flex;gap:8px;align-items:flex-start;min-height:96px}
.panel-c .who{font-size:44px;line-height:1;text-align:center}
.panel-c .who small{display:block;font-size:14px;color:var(--sub)}
.panel-c .bub{background:#fff;border:2px solid #2B2A33;border-radius:16px;padding:8px 10px;font-size:20px;position:relative}
.qline{font-size:23px;text-align:center;margin:6px 0 10px}
/* audition */
.judges{display:flex;justify-content:center;gap:18px;font-size:40px;margin:2px 0}
.judges span{position:relative}
.judges span b{position:absolute;top:-10px;right:-12px;font-size:22px}
/* letter tiles */
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:44px;height:54px;border-bottom:4px solid var(--accent2);font-family:'Andika',sans-serif;font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center;background:#F6F9FF;border-radius:8px 8px 0 0;cursor:pointer}
.slot.ok{background:#E6F8EE;border-color:var(--good)}
.ltile{font-family:'Andika',sans-serif;font-weight:700;font-size:28px;width:52px;height:56px;padding:0;background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 #E6D6BA}
.ltile.used{visibility:hidden}
.timerchip{font-size:17px;color:var(--sub)}
.be-table{font-size:18px;margin-top:6px}
.be-table b{font-family:'Andika',sans-serif}
/* shop v6 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font-size:16px;padding:7px 12px;border-radius:999px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.tabs button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.item{position:relative}
.item .ic{display:block;height:64px}
.item .ic svg{width:64px;height:64px}
.item .ic .emo{font-size:44px;line-height:64px}
.item .setb{position:absolute;top:4px;right:6px;font-size:16px}
.item .lk{display:block;font-size:13px;color:var(--sub)}
.item.locked .ic{filter:grayscale(1);opacity:.45}
.dress{background:#FFF0F5;border:3px dashed #FF9EB8;border-radius:16px;padding:8px 10px;font-size:17px;margin:8px 0}
.dress.ok{background:#E6F8EE;border-color:#A8DDBF}
.setchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.setchips span{font-size:14px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 9px}
.setchips span.full{background:#FFF4C2;border-color:#F5D66B}
.style-score{font-size:19px;text-align:center;margin-top:8px}
.reaction{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px;margin:4px;font-size:17px}
.pic svg.scene{width:170px;height:190px;display:block}
.pic-label{margin-top:-4px}
.balloon .bb svg.acticon{width:74px;height:74px;background:#fff;border-radius:50%;padding:6px;box-sizing:content-box;border:3px solid rgba(255,255,255,.7)}
.balloon .bb{width:128px;height:144px;font-size:0}
.balloon .bb::after{left:59px !important}
.bubble svg.scene.bub{width:90px;height:100px;vertical-align:middle}
svg.face{width:44px;height:40px;vertical-align:middle}
.dancer{animation:dancebob .8s ease-in-out infinite;transform-origin:100px 214px}
@keyframes dancebob{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.intro h1{text-align:center}
.howto{font-size:21px;line-height:1.7;max-width:720px;margin:6px auto 14px;background:#FFFDF6;border:2px dashed var(--line);border-radius:18px;padding:12px 18px 12px 44px}
.cd{position:absolute;inset:0;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;z-index:5;border-radius:inherit}
.cd span{font-size:84px;color:var(--accent);text-shadow:0 4px 0 #fff;animation:pop .45s}
.tgt{padding:6px 14px;font-size:24px}
.tgt b{font-size:28px}
.tgt.rev{animation-name:slideR}
@keyframes slideR{from{left:calc(98% - 150px)}to{left:2%}}
.arena.range{height:400px}
#qarea.locked{pointer-events:none}
.item.lux{border-color:#E0B000;background:linear-gradient(160deg,#FFFBEA,#FFF0F8 60%,#EEF6FF);box-shadow:0 4px 0 #E0B000,0 0 10px rgba(255,200,40,.45)}
.item.lux .pr{color:#A35A00;font-weight:700}.item .luxb{position:absolute;left:6px;top:4px;font-size:15px}
.tabs button[data-tab="lux"]{background:linear-gradient(90deg,#FFF1B8,#FFD6EC);border-color:#E0B000}
.tabs button[data-tab="lux"].on{background:linear-gradient(90deg,#FFB800,#FF6FA0);color:#fff;border-color:#E08A00}
.final-box{text-align:center;margin-top:12px;padding:10px;border:3px dashed #7FA2FF;border-radius:16px;background:#F2F6FF}.final-box button{font-size:21px;padding:10px 20px}.final-box small{font-size:15px}
.final-note{background:#FFF1C9;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:18px}
.qopts.qtxt.four{grid-template-columns:1fr 1fr;max-width:720px}
.gaterow.miss{opacity:.3;transition:opacity .4s}

.fish{position:absolute;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;z-index:2}
.fish.R{left:-48%;animation:swimR linear forwards}
.fish.L{left:110%;animation:swimL linear forwards;flex-direction:row-reverse}
.fish.L .fe{transform:scaleX(-1)}
@keyframes swimR{to{left:110%}}
@keyframes swimL{to{left:-48%}}
.fish .fe{font-size:46px}
.fish .fs{background:#fff;border:3px solid #2B7FB8;border-radius:16px;padding:6px 12px;font-size:21px;box-shadow:0 3px 0 #2B7FB8}
.fish.caught{animation-play-state:paused}
.fish.good .fs{background:#E6F8EE;border-color:var(--good)}
.fish.bad .fs{background:#FFE9E9;border-color:var(--bad)}
.fish.caught .fe{animation:pop .3s}
.belt{position:relative;overflow:hidden;height:96px;border-radius:16px;background:repeating-linear-gradient(90deg,#5A5A6A 0 22px,#4A4A58 22px 44px);border:4px solid #3A3A46;margin:10px 0;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.belt-track{position:absolute;top:14px;left:0;display:flex;gap:16px;width:max-content;animation:beltmove linear infinite;padding-left:16px}
@keyframes beltmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.bcard{flex:none}
.bcard.grab{background:#E6F8EE;border-color:var(--good)}
.tile.ghost{color:#BBB;border-style:dashed;box-shadow:none}
.arena.rain{background:linear-gradient(#2E2457,#5B3F8F);height:360px}
.drop{position:absolute;top:-70px;width:58px;height:58px;padding:0;border-radius:50%;background:#FFF6D6;color:#2B2A33;border:3px solid #F5C84B;font-size:30px;box-shadow:0 4px 0 #D9A92C;animation:fall3 linear forwards;z-index:2}
@keyframes fall3{to{transform:translateY(450px)}}
.drop.hit{animation-play-state:paused;opacity:.4}
.fl{display:inline-block;min-width:.62em;text-align:center;border-bottom:3px solid var(--accent2);margin:0 1px}
.fl.ok{color:var(--good);border-color:var(--good)}
.arena.range{background:linear-gradient(#FFF3E0,#FFE0B8);height:300px}
.tgt{position:absolute;left:0;font-size:30px;padding:8px 18px;border-radius:999px;background:#fff;color:var(--ink);border:4px solid #E5484D;animation:slide ease-in-out infinite alternate;display:flex;align-items:center;gap:8px}
.tgt b{font-size:32px}
@keyframes slide{from{left:2%}to{left:calc(98% - 160px)}}
.tgt.hitok{background:#E6F8EE;border-color:var(--good);animation-play-state:paused}
.blank-box{display:inline-block;min-width:2.2em;border-bottom:4px solid var(--accent);color:var(--accent);text-align:center}
.track{max-width:720px;margin:10px auto;background:#E9F7E1;border-radius:16px;padding:6px 10px;border:3px solid #BDE3A8}
.lane{position:relative;height:52px;border-bottom:2px dashed #BDE3A8}
.lane:last-child{border-bottom:none}
.runner{position:absolute;left:0;top:4px;font-size:40px;transition:left .3s}
.runner.rival{transition-property:left;transition-timing-function:linear}
.flag{position:absolute;right:2px;top:6px;font-size:34px}
.boss-row{display:flex;gap:14px;align-items:center;margin:16px 0 8px}
.boss-row .grow{flex:1}
.boss{font-size:64px;text-align:center;line-height:1;transition:transform .2s}
.boss small{display:block;font-size:14px;color:var(--sub)}
.boss.hurt{animation:shake .4s;filter:hue-rotate(90deg)}
.boss.laugh{animation:pop .4s}
.boss.angry{animation:pulse 1s infinite;border-radius:50%}
.gauge.hp i{background:linear-gradient(90deg,#E5484D,#FF9A5C)}
.atk-opts{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:12px auto}
.atk{font-size:24px;padding:14px}

function actIcon(id){ return `<svg class="acticon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${ACT_ICON[id]}</svg>`; }
function sceneSVG(actId, castKey, cls){
  const c = castOf(castKey || 'me'); const eq = Object.assign({}, c.eq);
  if(actId === 'listen') eq.ear = 'headphone';
  if(actId === 'run') eq.pose = 'run';
  const body = bodyOf(eq, c.style);
  const char = actId === 'dance' ? `<g class="dancer"><g transform="rotate(-9 100 214)">${body}</g></g>` : actId === 'run' ? `<g transform="rotate(6 100 214)">${body}</g>` : body;
  return `<svg class="scene ${cls||''}" viewBox="-12 -30 258 288" xmlns="http://www.w3.org/2000/svg">${char}${PROPS[actId] || ''}</svg>`;
}
function whoScene(id, qm){
  const c = castOf(id);
  const far = id !== 'you';
  let s = `<svg class="scene" viewBox="-12 -30 258 288" xmlns="http://www.w3.org/2000/svg">`;
  if(far) s += `<ellipse cx="110" cy="236" rx="70" ry="9" fill="#000" opacity=".08"/><g transform="translate(24 40) scale(.8)">${bodyOf(c.eq, c.style)}</g>`;
  else s += bodyOf(c.eq, c.style) + `<g transform="translate(-6 196) rotate(-20)"><path d="M0 14 H34 V4 L58 22 L34 40 V30 H0Z" fill="#FF8CB8" ${SOL}/></g>`;
  if(qm) s += `<g><rect x="166" y="-26" width="62" height="52" rx="18" fill="#FFE36E" ${SOL}/><path d="M178 22 L170 42 L194 24Z" fill="#FFE36E" ${SOL}/><text x="197" y="14" font-size="38" font-weight="700" text-anchor="middle" fill="#5B4034">?</text></g>`;
  return s + '</svg>';
}
function nameFace(n){ const c = CAST[n.en]; return avatarSVG(c.eq, c.style, 'face', '40 20 120 106'); }

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
const act = id => ACTIONS.find(a => a.id === id);

function rest(a){ return a.rest ? ' ' + a.rest : ''; }
function wrongA(a, kind){
  const R = rest(a), other = sample(ACTIONS.filter(x => x.id !== a.id && x.rest), 1)[0];
  if(kind === 'gram') return sample([`I'm ${a.base}${R}.`, `I ${a.ing}${R}.`, `I'm ${a.base}s${R}.`, `I am ${a.base}${R}.`, ...(a.dbl ? [`I'm ${a.base}ing${R}.`, `I'm ${a.base}ing${R}.`] : [])], 1)[0];
  if(kind === 'punct') return sample([`i'm ${a.ing}${R}.`, `I'm ${a.ing}${R}`, `Im ${a.ing}${R}.`, `I'm ${a.ing}${R}?`], 1)[0];
  return a.rest ? `I'm ${a.ing} ${other.rest}.` : sample(ACTIONS.filter(x => x.id !== a.id), 1)[0].full;
}
function wrongQ(w, kind){
  const badBe = w.be === 'is' ? sample(['am','are'],1)[0] : sample(['am','is'],1)[0];
  if(kind === 'gram') return sample([`What ${badBe} ${w.id} doing?`, `What ${w.be} ${w.id} do?`, `What ${w.id} ${w.be} doing?`], 1)[0];
  if(kind === 'punct') return sample([`what ${w.be} ${w.id} doing?`, `What ${w.be} ${w.id} doing.`, `What ${w.be} ${w.id} doing`], 1)[0];
  return sample(WHO.filter(x => x.id !== w.id), 1)[0].q;
}
function wrongH(a, w, kind){
  const R = rest(a), W = w === 'he' ? 'He' : 'She', O = w === 'he' ? "She's" : "He's";
  if(kind === 'gram') return sample([`${W} ${a.ing}${R}.`, `${W}'s ${a.base}${R}.`, `${W} is ${a.base}${R}.`, `${W}'s ${a.base}s${R}.`, ...(a.dbl ? [`${W}'s ${a.base}ing${R}.`, `${W}'s ${a.base}ing${R}.`] : [])], 1)[0];
  if(kind === 'punct') return sample([`${W.toLowerCase()}'s ${a.ing}${R}.`, `${W}'s ${a.ing}${R}`, `${W}s ${a.ing}${R}.`, `${W}'s ${a.ing}${R}?`], 1)[0];
  return sample([`${O} ${a.ing}${R}.`, `I'm ${a.ing}${R}.`, ansText(sample(HE_ACTS.filter(x => x !== a.id),1)[0], w)], 1)[0];

/* 아무 문장에나 틀린 곳 하나 만들기 (문법 gram / 문장부호 punct) */
function errText(T, kind){
  const isQ = T.endsWith('?'), a = ACTIONS.find(x => T.includes(' ' + x.ing)), P = [];
  if(kind !== 'gram'){
    P.push(T[0].toLowerCase() + T.slice(1), T.slice(0, -1) + (isQ ? '.' : '?'), T.slice(0, -1));
    if(T.includes("'")) P.push(T.replace("'", ''));
  }
  if(kind !== 'punct'){
    const mq = T.match(/^What (is|are|am) (.+) doing\?$/), ma = T.match(/^(I'm|He's|She's) (.+)$/);
    if(isQ && mq) P.push(`What ${mq[2]} ${mq[1]} doing?`, `What ${mq[1] === 'is' ? 'are' : 'is'} ${mq[2]} doing?`, `What ${mq[1]} ${mq[2]} do?`);
    else if(ma && a){
      const subj = ma[1], bare = subj === "I'm" ? 'I' : subj.slice(0, -2), body = ma[2];
      P.push(`${bare} ${body}`, `${subj} ${body.replace(a.ing, a.base)}`, `${bare} ${bare === 'I' ? 'is' : 'are'} ${body}`, `${subj} is ${body}`);
    }
  }
  const c = P.filter(x => x !== T);
  return c.length ? sample(c, 1)[0] : T.slice(0, -1);
}
/* 보기 4개 = (맞는 뜻, 다른 뜻) × (바른 문장, 틀린 곳 있는 문장): 정답이 보기들의 '가운데'에 오지 않게 */
function opts2x2(T, O, kind){
  const s = new Set([T, O]);
  for(let t = 0; t < 10 && s.size < 3; t++) s.add(errText(T, kind));
  for(let t = 0; t < 10 && s.size < 4; t++) s.add(errText(O, kind));
  return shuffle([...s]);
}
function fishPlan(r){ return r < 3 ? ['other','other','gram','ogram'] : r < 6 ? ['other','gram','punct','ogram'] : ['other','gram','punct','opunct']; }
function fishOpts(T, others, r){
  const set = new Set([T]);
  fishPlan(r).forEach((k, i) => {
    for(let t = 0; t < 12; t++){
      const v = k === 'other' ? others[(i + t) % others.length] : k[0] === 'o' ? errText(others[0], k.slice(1)) : errText(T, k);
      if(!set.has(v)){ set.add(v); break; }
    }
  });
  return [...set];
}
function fishRoundH(aid, w, r){
  const target = ansText(aid, w), a = act(aid);
  const others = shuffle([ansText(aid, w === 'he' ? 'she' : 'he'), `I'm ${a.ing}${rest(a)}.`, ansText(sample(HE_ACTS.filter(x => x !== aid), 1)[0], w)]);
  return {t:'fish', kind:'h', a:aid, w, r, target, opts:fishOpts(target, others, r)};
}
function fishRound(kind, id, r){
  const target = kind === 'a' ? act(id).full : who(id).q;
  const others = kind === 'a' ? sample(ACTIONS.filter(x => x.id !== id), 3).map(x => x.full) : shuffle(WHO.filter(x => x.id !== id).map(x => x.q));
  return {t:'fish', kind, [kind==='a'?'a':'w']:id, r, target, opts:fishOpts(target, others, r)};
}
function buildStage(i){
  if(S && S.ep === 2) return buildStage2(i);
  const NEW = ACTIONS.filter(a => a.isNew), OLD = ACTIONS.filter(a => !a.isNew);
  const mix = (n, k) => shuffle([...sample(NEW, k), ...sample(OLD, n - k)]);
  switch(i){
    case 0: return mix(8, 3).map((a,r) => ({t:'balloon', a:a.id, r, opts:optsFor(a.id)}));
    case 1: {
      const pick = shuffle([...sample(SENT.filter(x => x[0]==='q'), 2), ...sample(SENT.filter(x => x[0]==='h'), 2), ...mix(4, 2).map(a => 'a:' + a.id)]);
      return pick.map((s,r) => {
        let others;
        if(s[0] === 'q') others = [...SENT.filter(x => x[0]==='q' && x !== s), ...sample(SENT.filter(x => x[0]!=='q'), 2)];
        else {
          const aid = s.split(':').pop();
          const same = SENT.filter(x => x !== s && x[0] !== 'q' && x.split(':').pop() === aid);
          const rest2 = sample(SENT.filter(x => x[0] !== 'q' && x !== s && !same.includes(x)), 4 - Math.min(2, same.length) - 1);
          others = [...sample(same, 2), ...rest2, ...sample(SENT.filter(x => x[0]==='q'), 1)];
        }
        return {t:'mole', s, r, opts:[s, ...others.slice(0,4)]};
      });
    }
    case 2: {
      const as = mix(3, 2), ws = shuffle(WHO), hs = sample(HE_ACTS, 2), hw = shuffle(['he','she']);
      const seq = [['a', as[0].id], ['h', hs[0], hw[0]], ['q', ws[0].id], ['a', as[1].id], ['q', ws[1].id], ['h', hs[1], hw[1]], ['q', ws[2].id], ['a', as[2].id]];
      return seq.map(([k,id,w], r) => k === 'h' ? fishRoundH(id, w, r) : fishRound(k, id, r));
    }
    case 3: {
      const as = mix(2, 1), ws = shuffle(WHO);
      return [
        {t:'speak', kind:'q', w:ws[0].id, lvl:'full'}, {t:'speak', kind:'a', a:as[0].id, lvl:'full'},
        {t:'speak', kind:'q', w:ws[1].id, lvl:'hint'}, {t:'speak', kind:'h', a:sample(HE_ACTS,1)[0], w:sample(['he','she'],1)[0], lvl:'hint'},
        {t:'speak', kind:'a', a:as[1].id, lvl:'pic'},  {t:'speak', kind:'q', w:ws[2].id, lvl:'pic'}
      ];
    }
    case 4: {
      const ws = shuffle(WHO), hs = sample(HE_ACTS, 2);
      let hi = 0;
      return ws.flatMap((w,k) => {
        const qx = sample(['am','is','are','he','she','you','do','does'].filter(x => !w.q.split(' ').includes(x)), 2);
        const qq = {t:'belt', kind:'q', w:w.id, extra:qx, r:k*2};
        if(w.id === 'you'){
          const a = sample(ACTIONS,1)[0];
          return [qq, {t:'belt', kind:'a', a:a.id, extra:sample([a.base, a.base + 's', 'is', 'are', 'I', 'my'], 2), r:k*2+1}];
        }
        const a = act(hs[hi++]);
        return [qq, {t:'belt', kind:'h', a:a.id, w:w.id, extra:sample([a.base, a.base + 's', 'are', "I'm", w.id === 'he' ? "She's" : "He's"], 2), r:k*2+1}];
      });
    }
    case 5: {
      const fa = shuffle([act(sample(['swim','run'],1)[0]), ...sample(ACTIONS.filter(x => !x.dbl), 2)]);
      const fl = fa.map((a,r) => ({t:'fall', a:a.id, r, extra:[a.base.endsWith('e') ? 'e' : sample('aeinrt'.split(''),1)[0], sample('aeiost'.split(''),1)[0], sample('bcdkmp'.split(''),1)[0]]}));
      const tg = [sample(['you','i'],1)[0], sample(['he','she'],1)[0], sample(['Jun','Mina','Leo','Amy'],1)[0]].map(w => ({t:'target', w, a:sample(ACTIONS,1)[0].id, opts:shuffle(['am','is','are','be','do','does'])}));
      const rc = [sample(NEW,1)[0], sample(OLD,1)[0]].map(a => ({t:'race', a:a.id}));
      return [fl[0], tg[0], fl[1], tg[1], fl[2], tg[2], rc[0], rc[1]];
    }
    case 6: {
      const as = mix(4, 2).map(a => a.id), ws = shuffle(WHO), two = () => sample([0,1,2,3],2), hs = sample(HE_ACTS, 2), hw = shuffle(['he','she']);
      const d1 = two();

        {t:'boss', mode:'hear', a:as[0], n1:sample([0,1,2,3],1)[0]},
        {t:'boss', mode:'ask', w:ws[0].id},
        {t:'boss', mode:'tell', a:hs[0], w:hw[0], n1:sample([0,1,2,3],1)[0]},
        {t:'boss', mode:'dict', a:as[1], n1:d1[0], n2:d1[1]},

        {t:'boss', mode:'ask', w:ws[2].id}
      ];
    }
  }
}

let VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
  VOICE = en.find(v => /Google US English|Samantha|Aria|Jenny|Ana|Zira/i.test(v.name)) || en[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate, pitch){
  return new Promise(res => {
    if(!('speechSynthesis' in window)){ res(); return; }
    try{
      speechSynthesis.cancel();
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; if(VOICE) u.voice = VOICE; u.rate = rate || 0.85; u.pitch = pitch || 1;
        let done = false; const fin = () => { if(!done){ done = true; res(); } };
        u.onend = fin; u.onerror = fin; setTimeout(fin, 9000);
        speechSynthesis.speak(u);
      }, 60);
    }catch(e){ res(); }
  });
}
async function sayLines(lines, rate){ for(const [t,p] of lines){ await say(t, rate, p); await new Promise(r => setTimeout(r, 250)); } }
let ACTX = null;
function tone(freqs, dur, type, vol){
  try{
    ACTX = ACTX || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ACTX.currentTime;
    freqs.forEach((f,i) => {
      const o = ACTX.createOscillator(), g = ACTX.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || .16, t0 + i*dur);
      g.gain.exponentialRampToValueAtTime(.001, t0 + i*dur + dur);
      o.connect(g); g.connect(ACTX.destination); o.start(t0 + i*dur); o.stop(t0 + i*dur + dur + .02);
    });
  }catch(e){}
}

  const i = S.stage;
  S.stars[i] = S.stars[i] || 0; S.lastBonus = 0; S.lastStars = 0; S.lastCleared = i; S.skipped = true;
  S.shopAvail = (i + 1) % 2 === 0 || i + 1 >= STAGES.length; S.shopUntil = null; S.retries = 0;
  S.stage++; if(ep() === 2) S.max2 = Math.max(S.max2 || 0, S.stage); else S.maxCleared = Math.max(S.maxCleared, S.stage);
  S.q = 0; S.tries = 0; S.solved = false; S.list = S.stage < STAGES.length ? buildStage(S.stage) : [];
  save(); PREV = VIEW; VIEW = 'clear'; render();
}
function nextQuestion(){
  stopListening(); clearGT();
  S.q++; S.tries = 0; S.solved = false;
  if(S.q >= S.list.length){
    const i = S.stage, r = S.stats[i] || {n:1, first:0}, ratio = r.first / Math.max(1, r.n);
    const stars = ratio >= .9 ? 3 : ratio >= .7 ? 2 : 1;
    S.stars[i] = Math.max(S.stars[i] || 0, stars);
    const bonus = stageBonus(i) + stars * 10;
    S.coins += bonus; S.lastBonus = bonus; S.lastStars = stars; S.lastCleared = i;
    S.shopAvail = (i + 1) % 2 === 0 || i + 1 >= STAGES.length; S.shopUntil = null; S.retries = 0;
    S.stage++; if(ep() === 2) S.max2 = Math.max(S.max2 || 0, S.stage); else S.maxCleared = Math.max(S.maxCleared, S.stage); S.skipped = false;
    S.q = 0; S.list = S.stage < STAGES.length ? buildStage(S.stage) : [];
    save(); VIEW = 'clear'; render(); return;
  }
  save(); render();
}

/* --- 2. 놀이터: 두더지 잡기 --- */
function qMole(q){
  const target = sText(q.s);
  const upTime = Math.max(2300, 3400 - q.r * 150);
  const sid2pair = id => id[0] === 'q' ? {k:'q', w:id.slice(2)} : id[0] === 'h' ? {k:'h', w:id.split(':')[1], a:id.split(':')[2]} : {k:'a', a:id.slice(2)};
  const molePic = id => qPicHTML(qPicOf(sid2pair(id)));
  $('#qarea').innerHTML = `<p class="inst center">문장을 잘 듣고, <b>맞는 그림</b>을 든 두더지를 잡아요! 두더지는 금방 숨어요.</p>${soundButtons()}
    <div class="center timerchip">${q.retry ? '다시 도전' : `라운드 ${q.r+1}/8`} · 숨는 속도 ${(upTime/1000).toFixed(1)}초</div>
    <div class="mole-field">${[0,1,2,3,4,5].map(i => `<div class="hole"><div class="mole" id="m${i}"><div class="mface">🐹</div><div class="msign en"></div></div><div class="dirt"></div></div>`).join('')}</div>`;
  bindSound(target);
  let lastHad = false;
  const cycle = () => {
    if(S.solved || VIEW !== 'play') return;
    $$('.mole').forEach(m => m.classList.remove('up','hit'));
    gt(() => {
      const help = helpOn();
      const holes = shuffle([0,1,2,3,4,5]).slice(0, help ? 2 : 3);
      const others = shuffle(q.opts.filter(x => x !== q.s));
      const withT = help || !lastHad || Math.random() < .55;
      const picks = help ? shuffle([q.s, others[0]]) : withT ? shuffle([q.s, others[0], others[1]]) : others.slice(0,3);
      lastHad = withT;
      holes.forEach((h,k) => { const m = $('#m'+h); m.dataset.s = picks[k]; const sg = m.querySelector('.msign'); sg.classList.add('pic'); sg.innerHTML = molePic(picks[k]); m.classList.add('up'); });
      gt(cycle, help ? upTime * 1.8 : upTime);
    }, 420);
  };
  $$('.mole').forEach(m => m.onclick = () => {
    if(!m.classList.contains('up') || m.classList.contains('hit') || S.solved) return;
    if(m.dataset.s === q.s){ m.classList.add('bonk'); sfxPop(); say(target); correct(target); }
    else { m.classList.add('hit'); wrong('앗, 그 두더지가 아니에요! 🔊 다시 듣고 잡아요.'); gt(() => m.classList.remove('up'), 350); gt(() => say(target), 500); }
  });
  if(!S.solved) countdown(() => { say(target); gt(cycle, 900); });
}

/* --- 4. 음악 무대: 오디션 (글자가 점점 사라짐) --- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function micPolicyOK(){ try{ const p = document.permissionsPolicy || document.featurePolicy; if(p && p.allowsFeature) return p.allowsFeature('microphone'); }catch(e){} return true; }
function canRecord(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) && micPolicyOK(); }
function detectMode(){
  if(S && S.speechMode) return S.speechMode;
  if(SR && micPolicyOK()) return 'auto';
  if(canRecord()) return 'record';
  return 'none';
}
const MODE_NOTE = {auto:'🤖 자동 채점 모드', record:'🎙️ 녹음해서 스스로 확인하는 모드', none:'🗣️ 듣고 큰 소리로 따라 말하는 모드 (이 기기는 마이크를 쓸 수 없어요)'};
let REC = null, MR = null, MRstream = null, recTimer = null;
function stopListening(){
  try{ if(REC){ REC.onend = null; REC.abort(); } }catch(e){} REC = null;
  try{ if(MR && MR.state !== 'inactive') MR.stop(); }catch(e){}
  try{ if(MRstream) MRstream.getTracks().forEach(t => t.stop()); }catch(e){} MRstream = null;
  clearTimeout(recTimer);
}
function normWords(s){
  return s.toLowerCase().replace(/[’‘`´]/g,"'")
    .replace(/\bwhat's\b/g,'what is').replace(/\bhe's\b/g,'he is').replace(/\bshe's\b/g,'she is').replace(/\bwhat're\b/g,'what are')
    .replace(/\bi am\b/g,"i'm").replace(/\bim\b/g,"i'm")
    .replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
}
function speechScore(heard, target){
  const t = normWords(target), pool = normWords(heard); let m = 0;
  const marks = t.map(w => { const i = pool.indexOf(w); if(i >= 0){ pool.splice(i,1); m++; return true; } return false; });
  return {score: m / t.length, marks, t};
}
const maskText = t => t.split(' ').map(w => w.replace(/^([A-Za-z])([A-Za-z']*)/, (m,a,b) => a + b.replace(/[A-Za-z']/g,'_'))).join(' ');

  else if(lvl === 'pic' && q.kind === 'h') prompt = `<div class="chat"><div class="bubble friend">${ep()===2?'👽 외계인':'🧑‍⚖️ 심사위원'}: <span class="en">What is ${q.w} doing?</span> <button class="sec small" id="judgeSay">🔊</button></div></div><div class="qbox">${hPic(q.a, q.w)}<div style="font-size:21px">그림을 보고 대답해요!</div></div>`;
  else if(lvl === 'pic') prompt = `<div class="qbox">${whoPic(q.w,true)}<div style="font-size:21px">${iga(who(q.w).label)} 뭘 하는지<br>영어로 물어봐요!</div></div>`;
  else prompt = `${q.kind==='h' ? `<div class="chat"><div class="bubble friend">${ep()===2?'👽 외계인':'🧒 친구'}: <span class="en">What is ${q.w} doing?</span></div></div>` : ''}<div class="qbox">${q.kind==='q'?whoPic(q.w,true):q.kind==='h'?hPic(q.a,q.w):actPic(q.a)}<div class="sentence en">${lvl==='full'?text:maskText(text)}</div></div>`;
  const J = ep() === 2 ? ['👽','🛸','🤖'] : ['🧑‍🎤','🧑‍🏫','🧑‍💼'];
  const fuel = Math.round(S.q / S.list.length * 100);
  const top = ep() === 2 ? `<div class="fuel-row"><span class="fuel-rocket">🚀</span><div class="grow"><div style="font-size:17px">⛽ 로켓 연료 <b id="fuelN">${fuel}</b>%</div><div class="gauge fuel"><i id="fuelBar" style="width:${fuel}%"></i></div></div></div>` : `<div class="judges">${J.map(j => `<span>${j}</span>`).join('')}</div>`;
  $('#qarea').innerHTML = `${top}
    <p class="inst center"><b>${lvlName}</b></p>${prompt}
    <div class="listen-row" id="hintRow" style="${lvl==='pic' && S.tries<2 ? 'display:none' : ''}"><button class="sec" id="sBtn">🔊 ${lvl==='full'?'먼저 듣기':'힌트 듣기'}</button><button class="sec" id="slowBtn">🐢</button></div>
    <div id="speakArea" class="center"></div>`;
  bindSound(text);
  const jq = lvl === 'pic' && q.kind === 'h' ? `What is ${q.w} doing?` : 'What are you doing?';

function speakDone(text){

function addNoMic(q, text){

  area.insertAdjacentHTML('beforeend', `<div class="nomic"><button class="nomic-btn" id="noMic">🙋 녹음이 안 돼요 → 따라 말하기로 바꾸기</button></div>`);
  $('#noMic').onclick = () => { stopListening(); S.speechMode = 'none'; save(); $('#fb').innerHTML = `<div class="feedback info">괜찮아요! 이제부터는 원어민 소리를 듣고 <b>큰 소리로 따라 말하기</b>로 해요.</div>`; drawSpeakArea(q, text); };
}
function listenOnce(q, text){
  if(S.solved) return;
  const btn = $('#micBtn'), heard = $('#heard');
  stopListening();
  let r;
  try{ r = new SR(); }catch(e){ S.speechMode = canRecord() ? 'record' : 'none'; save(); drawSpeakArea(q, text); return; }
  REC = r; r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let alts = [], live = '', err = null;
  btn.classList.add('listening'); btn.textContent = '👂 듣고 있어요… 말하세요!'; heard.innerHTML = '';
  r.onresult = e => {
    live = Array.from(e.results).map(x => x[0].transcript).join(' ');
    heard.innerHTML = `<span class="en muted">${esc(live)}</span>`;
    for(const res of e.results){ if(res.isFinal) alts = Array.from(res).map(x => x.transcript); }
  };
  r.onerror = e => { err = e.error; };
  r.onend = () => {
    REC = null; clearTimeout(recTimer);
    btn.classList.remove('listening'); btn.textContent = '🎤 다시 말하기';
    if(['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].includes(err)){
      const why = err === 'not-allowed' || err === 'service-not-allowed' ? '마이크 사용이 허락되지 않았어요.' : err === 'network' ? '이 브라우저에서는 자동 채점(인터넷 음성 인식)을 쓸 수 없어요.' : '이 기기에서는 자동 채점을 시작할 수 없어요.';
      S.speechMode = canRecord() ? 'record' : 'none'; save();
      $('#fb').innerHTML = `<div class="feedback info">${why} 다른 방법으로 바꿀게요.</div>`;
      drawSpeakArea(q, text); return;
    }
    if(!alts.length && live) alts = [live];
    if(!alts.length){ S.srMiss = (S.srMiss || 0) + 1; heard.innerHTML = S.srMiss >= 2 ? '🙉 소리가 계속 안 들려요. 아래 <b>녹음이 안 돼요</b> 버튼을 눌러도 괜찮아요.' : '🙉 소리가 잘 안 들렸어요. 버튼을 누르고 조금 더 크게 말해 볼까요?'; const nb = $('#noMic'); if(nb && S.srMiss >= 2) nb.classList.add('pulse'); return; }
    let best = null, bestAlt = '';
    alts.forEach(a => { const sc = speechScore(a, text); if(!best || sc.score > best.score){ best = sc; bestAlt = a; } });
    const marked = best.t.map((w,i) => `<span class="${best.marks[i]?'w-ok':'w-bad'}">${w}</span>`).join(' ');
    if(best.score >= 0.7){ heard.innerHTML = `들린 말: <span class="en">"${esc(bestAlt)}"</span>`; speakDone(text); }
    else {
      const showMarks = q.lvl === 'full' || S.tries >= 1;
      wrong(`들린 말: <span class="en">"${esc(bestAlt)}"</span>${showMarks?`<div style="margin-top:6px;font-size:26px" class="en">${marked}</div><div style="font-size:18px">빨간 단어를 더 또박또박!</div>`:'<div style="font-size:18px">다시 한번 말해 봐요!</div>'}`);
      heard.innerHTML = '';
      const hr = $('#hintRow'); if(hr && S.tries >= 2) hr.style.display = '';
      if(S.tries >= 3 && !$('#toRec')) drawSpeakArea(q, text);
    }
  };
  try{ r.start(); }catch(e){ btn.classList.remove('listening'); btn.textContent = '🎤 말하기'; return; }
  recTimer = setTimeout(() => { try{ r.stop(); }catch(e){} }, 7000);
  gt(() => { if(REC === r){ try{ r.abort(); }catch(e){} REC = null; const b = $('#micBtn'); if(b){ b.classList.remove('listening'); b.textContent = '🎤 다시 말하기'; } const h = $('#heard'); if(h) h.innerHTML = '🙉 마이크가 잘 안 되는 것 같아요. 다시 해 보거나 아래 버튼을 눌러요.'; } }, 10000);
}

    if(S.solved) return;
    const btn = $('#recBtn');

    catch(e){ S.speechMode = 'none'; save(); $('#fb').innerHTML = `<div class="feedback info">마이크를 쓸 수 없어서 '따라 말하기' 방법으로 바꿀게요.</div>`; drawNone(q, text); return; }

/* ===================== 게임 공통 ===================== */
function arenaLoop(fn, ms){ const tick = () => { if(S.solved || VIEW !== 'play') return; fn(); gt(tick, typeof ms === 'function' ? ms() : ms); }; tick(); }
function pickWithTarget(target, opts, state, onScreen){
  onScreen = onScreen || [];

    // 정답은 2~5번째 중 한 곳에서 처음 나와요 (매번 랜덤)
    state.started = true; state.shown = false;
    const others = opts.filter(x => x !== target), k = 1 + Math.floor(Math.random() * 4), pre = [];
    let pool = shuffle(others);
    while(pre.length < k){
      if(!pool.length) pool = shuffle(others);
      const j = pool.findIndex(x => x !== pre[pre.length - 1]);
      pre.push(pool.splice(j < 0 ? 0 : j, 1)[0]);
    }
    state.bag = [...pre, target];
  }
  if(!state.bag.length){
    let b;
    for(let k = 0; k < 40; k++){ b = shuffle(opts); if(b[0] !== state.last) break; }
    state.bag = b;
  }
  let i = 0;
  if(state.shown){
    i = state.bag.findIndex(x => !onScreen.includes(x) && x !== state.last);
    if(i < 0) i = state.bag.findIndex(x => x !== state.last);
    if(i < 0) i = 0;
  }
  const x = state.bag.splice(i, 1)[0];
  if(x === target) state.shown = true;
  state.last = x;
  return x;
}

  inp.addEventListener('input', () => {

/* --- 7. 파티 하우스: 심술쟁이 DJ 대결 (문장부호까지 엄격 채점) --- */
function strictCheck(raw, target){
  const clean = raw.replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim();
  const alts = [target]; if(target.startsWith("I'm ")) alts.push(target.replace("I'm", 'I am')); if(target.startsWith("He's ")) alts.push(target.replace("He's", 'He is')); if(target.startsWith("She's ")) alts.push(target.replace("She's", 'She is'));
  if(alts.includes(clean)) return {ok:true};
  const loose = s => s.toLowerCase().replace(/\bi am\b/g,"i'm").replace(/\bhe is\b/g,"he's").replace(/\bshe is\b/g,"she's").replace(/[.?!,]/g,' ').replace(/\s+/g,' ').trim();
  if(alts.some(t => loose(t) === loose(clean))){
    const issues = [], ref = alts.find(t => loose(t) === loose(clean));
    if(/^[a-z]/.test(clean)) issues.push('문장의 <b>첫 글자</b>는 대문자로 써요.');
    if(/(^|\s)i('m)?(\s|$)/.test(clean)) issues.push('<b class="en">I</b>는 언제나 대문자로 써요.');
    const end = target.slice(-1);

function qMatch(q){

function fixData(q){

  if(q.kind === 'spell2'){
    const bad = a.dbl ? (q.v % 2 ? a.base + a.base.slice(-1).repeat(2) + 'ing' : a.base + 'ing') : a.base.endsWith('e') ? a.base + 'ing' : a.base + a.base.slice(-1) + 'ing';
    return {pic:actPic(q.a), frame:`I'm ${BLANK}${rest(a)}.`, ans:a.ing, bad, full:a.full,
      inst:'철자가 맞는 단어의 문으로! 글자를 하나하나 봐요.', rule:'<b class="en">swim → swimming</b>, <b class="en">run → running</b> (글자 한 번 더) &nbsp;|&nbsp; <b class="en">dance → dancing</b> (e 빼기)'};
  }
  if(q.kind === 'order'){
    const be = beOf(q.w), good = `What ${be} ${q.w} doing?`;
    const bad = [`What ${q.w} ${be} doing?`, `What ${be} doing ${q.w}?`, `What ${q.w} ${be} doing?`, `${be[0].toUpperCase() + be.slice(1)} what ${q.w} doing?`][q.v];
    return {pic:whoBox(q.w), frame:'', ans:good, bad, full:good, long:true,
      inst:'뭘 하는지 묻는 문장! <b>낱말 순서</b>가 맞는 문으로!', rule:'묻는 문장 순서: <b class="en">What → is/are → 누구 → doing?</b>'};
  }
  if(q.kind === 'agree'){
    const T = q.w === 'me' ? a.full : ansText(q.a, q.w);
    const full = q.w === 'me' ? `I am ${a.ing}${rest(a)}.` : `${q.w === 'he' ? 'He' : 'She'} is ${a.ing}${rest(a)}.`;
    const bads = q.w === 'me' ? [`I is ${a.ing}${rest(a)}.`, `I are ${a.ing}${rest(a)}.`, `I ${a.ing}${rest(a)}.`, `I'm ${a.base}${rest(a)}.`]
                              : [`${q.w === 'he' ? 'He' : 'She'} are ${a.ing}${rest(a)}.`, `${q.w === 'he' ? 'He' : 'She'} ${a.ing}${rest(a)}.`, `${q.w === 'he' ? 'He' : 'She'} am ${a.ing}${rest(a)}.`, `${q.w === 'he' ? 'He' : 'She'}'s ${a.base}${rest(a)}.`];
    const useFull = q.v % 2 === 0;
    return {pic:q.w === 'me' ? actPic(q.a) : hPic(q.a, q.w), frame:'', ans:useFull ? full : T, bad:bads[q.v], full:useFull ? full : T, long:true,
      inst:'그림에 맞는 <b>바른 문장</b>의 문으로! 틀린 곳이 하나 숨어 있어요.',
      rule:'<b class="en">I am (I\'m)</b> · <b class="en">He is (He\'s)</b> · <b class="en">She is (She\'s)</b> + <b class="en">-ing</b>'};
  }
  // two: 빈칸 두 개
  const be = beOf(q.w), good = `${be} … doing`;
  const bad = [`${be === 'is' ? 'are' : 'is'} … doing`, `${be} … do`, `${be === 'is' ? 'are' : 'is'} … doing`, `${be} … does`][q.v];
  return {pic:whoBox(q.w), frame:`What ${BLANK} ${q.w} ${BLANK}?`, ans:good, bad, full:`What ${be} ${q.w} doing?`,
    inst:'빈칸 <b>두 개</b>에 모두 맞는 말의 문으로! 둘 다 맞아야 해요.',
    rule:'<b class="en">What + is/are + 누구 + doing?</b> &nbsp;|&nbsp; 한 명 → <b class="en">is</b>, <b class="en">you</b>·두 명 → <b class="en">are</b>'};
}

/* --- 2편 3. 달 트랙: 갈림길 달리기 --- */
const BLANK = '<span class="blank-box">?</span>';
function runnerData(q){
  if(['qa','be2','ing','spell2','order','agree','two'].includes(q.kind)) return runnerData2(q);
  if(q.kind === 'subj'){
    const a = act(q.a), ans = q.w === 'he' ? "He's" : "She's";
    return {pic:hPic(q.a, q.w), frame:`${BLANK} ${a.ing}${rest(a)}.`, ans, bad:q.w === 'he' ? "She's" : "He's", full:ansText(q.a, q.w),
      inst:'그림 속 친구를 보고, 빈칸에 맞는 말의 문으로!', rule:'<b class="en">He\'s</b> 👦 남자아이 &nbsp;|&nbsp; <b class="en">She\'s</b> 👧 여자아이 &nbsp;|&nbsp; <b class="en">I\'m</b> 🙋 나'};
  }
  if(q.kind === 'be'){
    const ans = q.w === 'you' ? 'are' : 'is', isName = !WHO.find(w => w.id === q.w);
    const pic = isName ? `<div><div class="pic">${whoScene(q.w, true)}</div><div class="pic-label en">${q.w}</div></div>` : whoPic(q.w, true);
    return {pic, frame:`What ${BLANK} ${q.w} doing?`, ans, bad:ans === 'are' ? 'is' : 'are', full:`What ${ans} ${q.w} doing?`,
      inst:'빈칸에 맞는 말의 문으로 달려가요!', rule:'<b class="en">you</b> → <b class="en">are</b> &nbsp;|&nbsp; <b class="en">he, she, 이름(Jun, Mina…)</b> → <b class="en">is</b>'};
  }
  if(q.kind === 'spell'){
    const a = act(q.a), bad = a.dbl || a.base.endsWith('e') ? a.base + 'ing' : a.base + a.base.slice(-1) + 'ing';
    return {pic:actPic(q.a), frame:`I'm ${BLANK}${rest(a)}.`, ans:a.ing, bad, full:a.full,
      inst:'철자가 맞는 단어의 문으로 달려가요!', rule:'<b class="en">swim → swimming</b>, <b class="en">run → running</b> (글자 한 번 더) &nbsp;|&nbsp; <b class="en">dance → dancing</b> (e 빼기)'};
  }
  const T = q.sk === 'q' ? who(q.w).q : q.sk === 'h' ? ansText(q.a, q.w) : act(q.a).full;
  let bads;
  if(q.sk === 'q') bads = [T.replace('?', '.'), T[0].toLowerCase() + T.slice(1), `What ${q.w} ${who(q.w).be} doing?`, `What ${q.w === 'you' ? 'is' : 'are'} ${q.w} doing?`];
  else bads = [T.replace("'", ''), T[0].toLowerCase() + T.slice(1), T.replace(/\.$/, '?'), T.replace(/'[sm]/, '')];
  const pic = q.sk === 'q' ? whoPic(q.w, true) : q.sk === 'h' ? hPic(q.a, q.w) : actPic(q.a);
  const bad = bads[(q.v || 0) % bads.length];
  return {pic, frame:'', ans:T, bad, full:T, long:true,
    inst:q.sk === 'q' ? '이 친구가 뭘 하는지 묻는 <b>완벽한 문장</b>의 문으로!' : '그림에 맞는 <b>완벽한 문장</b>의 문으로!',
    rule:'첫 글자는 <b>대문자</b> · <b class="en">I\'m, He\'s</b>에는 <b class="en">\'</b> · 묻는 말은 <b class="en">?</b> 대답은 <b class="en">.</b>'};
}
const RUN_SPEED = [10, 9, 8, 7.2, 6.5, 5.8, 5.2];   // 문이 내려오는 시간(초): 잘 맞힐수록 빨라져요
function qRunner(q){
  if(S.runLv == null || (S.q === 0 && !q.retry && !q.seen)) S.runLv = 0;
  if(!q.seen){ q.seen = true; save(); }
  const d = runnerData(q), dur = () => RUN_SPEED[Math.min(RUN_SPEED.length - 1, S.runLv || 0)];
  const speedChip = () => `🏃 속도 ${'🔥'.repeat((S.runLv || 0) + 1)}${'·'.repeat(RUN_SPEED.length - 1 - (S.runLv || 0))} ${S.runLv >= RUN_SPEED.length - 1 ? '최고 속도!' : ''}`;
  $('#qarea').innerHTML = `<p class="inst center">${d.inst} <span class="muted" style="font-size:16px">가운데에서 출발해요. ◀ ▶ 버튼이나 길을 눌러 골라요.</span></p>
    <div class="qbox">${d.pic}${d.frame ? `<div class="sentence en" style="margin:0">${d.frame}</div>` : ''}</div>
    <div class="center timerchip">${q.retry ? '다시 도전' : `라운드 ${q.r+1}/8`} · <span id="spd">${speedChip()}</span></div>
    <div class="arena moon" id="arena"><div class="mlane" data-l="0"></div><div class="mlane" data-l="1"></div><div id="gates"></div>
      <div class="moonrun" id="runner" style="left:50%">${avatarSVG(S.eq, S.hero.style)}</div></div>
    <div class="lane-btns"><button class="sec" id="goL">◀ 왼쪽</button><button class="sec" id="goR">오른쪽 ▶</button></div>
    <div class="hint" id="hint"></div>`;
  let lane = -1, good = 0, live = false;
  const setLane = l => { if(S.solved) return; lane = l; const r = $('#runner'); if(r) r.style.left = l < 0 ? '50%' : l ? '75%' : '25%'; };
  const nextSide = () => {   // 정답 문이 왼쪽·오른쪽에 고르게, 같은 쪽이 3번 넘게 이어지지 않게
    if(!Array.isArray(S.runBag) || !S.runBag.length) S.runBag = shuffle([0,0,1,1]);
    const last = S.runLast || [];
    let k = 0;
    if(last.length >= 2 && last[last.length-1] === last[last.length-2]){ const j = S.runBag.findIndex(x => x !== last[last.length-1]); if(j >= 0) k = j; }
    const side = S.runBag.splice(k, 1)[0];
    S.runLast = [...last, side].slice(-2);
    return side;
  };
  $$('.mlane').forEach(el => el.onpointerdown = () => setLane(+el.dataset.l));
  $('#goL').onclick = () => setLane(0); $('#goR').onclick = () => setLane(1);
  window._runKey = e => { if(e.key === 'ArrowLeft') setLane(0); if(e.key === 'ArrowRight') setLane(1); };
  const showRule = () => { const h = $('#hint'); if(h) h.innerHTML = `<div class="be-table">${d.rule}</div>`; };
  const spawn = () => {
    if(S.solved || VIEW !== 'play') return;
    const g = $('#gates'); if(!g) return;
    good = nextSide(); setLane(-1);
    const help = helpOn();
    g.innerHTML = `<div class="gaterow" style="animation-duration:${help ? dur() * 1.6 : dur()}s">${[0,1].map(k => `<div class="gate ${d.long ? 'long' : ''} ${help && k === good ? 'nexthint' : ''}" style="left:${k ? 52 : 4}%"><span class="en">${esc(k === good ? d.ans : d.bad)}</span></div>`).join('')}</div>`;
    const row = g.firstChild;
    row.addEventListener('animationend', e => {
      if(e.target !== row || row.dataset.done || S.solved || VIEW !== 'play') return;
      row.dataset.done = 1;
      const gs = row.querySelectorAll('.gate');
      if(lane < 0){
        const h = $('#hint'); if(h) h.innerHTML = '<div class="be-table">⬅️ ➡️ 문이 오기 전에 <b>길을 골라야</b> 해요! 다시 달려 봐요.</div>';
        row.classList.add('miss'); setTimeout(() => row.remove(), 600); gt(spawn, 1400); return;
      }
      if(lane === good){
        gs[good].classList.add('pass'); sfxPop(); say(d.full);
        let up = '';
        if(S.tries === 0 && S.runLv < RUN_SPEED.length - 1){ S.runLv++; up = '<div style="font-size:19px">🔥 잘했어요! 다음 문은 <b>더 빨리</b> 와요!</div>'; }
        else if(S.tries === 0) up = '<div style="font-size:19px">🔥 최고 속도로 달리는 중!</div>';
        correct(d.full, up);
      }
      else {
        gs[lane].classList.add('crash'); setTimeout(() => row.remove(), 900); const r = $('#runner'); if(r){ r.classList.add('trip'); setTimeout(() => r.classList.remove('trip'), 600); }
        const slow = S.runLv > 0; S.runLv = Math.max(0, (S.runLv || 0) - 2); const sp = $('#spd'); if(sp) sp.textContent = speedChip();
        wrong(`쿵! <b class="en">${esc(d.bad)}</b> 문은 틀린 문이에요. ${slow ? '속도를 조금 늦출게요. ' : ''}다시 달려 봐요!`); showRule();
        gt(spawn, 1700);
      }
    });
  };
  HELP_HOOK = () => { showRule(); const gs = $$('.gate'); if(gs[good]) gs[good].classList.add('nexthint'); say(d.full); };
  if(!S.solved){ $('#arena').scrollIntoView({behavior:'smooth', block:'end'}); countdown(() => { live = true; spawn(); }); }
}
document.addEventListener('keydown', e => { if(VIEW === 'play' && window._runKey && $('#runner') && !S.solved) window._runKey(e); });

/* --- 2편 5. UFO 하늘: 문장 비행기 --- */
function qPlane(q){
  const text = qText(q), words = text.split(' '), cards = [...words, ...q.extra];
  let built = 0;
  const prompt = q.kind === 'h'
    ? `<div class="chat"><div class="bubble friend">👽 외계인: <span class="en">What is ${q.w} doing?</span></div></div><div class="qbox">${hPic(q.a, q.w)}<div style="font-size:20px">그림을 보고 대답 문장을 만들어요.</div></div>`
    : q.kind === 'a'
    ? `<div class="chat"><div class="bubble friend">👽 외계인: <span class="en">What are you doing?</span></div></div><div class="qbox">${actPic(q.a)}<div style="font-size:20px">그림을 보고 대답 문장을 만들어요.</div></div>`
    : `<div class="qbox">${whoPic(q.w,true)}<div style="font-size:20px">${iga(who(q.w).label)} 뭘 하는지<br>묻는 문장을 만들어요.</div></div>`;
  $('#qarea').innerHTML = `<p class="inst center">단어 UFO를 <b>눌러서</b> 미사일을 쏴요! 문장 <b>순서대로</b> 맞히고, 함정 UFO는 피해요.</p>${prompt}
    <div class="answer-line" id="ansLine">${words.map(() => '<span class="tile ghost">?</span>').join('')}</div>
    <div class="arena ufosky" id="arena"><div class="plane" id="plane">✈️</div></div>
    <div class="listen-row" id="hintRow" style="display:none"><button class="sec" id="sBtn">🔊 힌트 듣기</button></div>
    <div class="hint">⚡ 35초 안에 한 번도 안 틀리면 스피드 보너스!</div>`;
  bindSound(text);
  const ar = $('#arena'), plane = $('#plane'), ufos = [], shots = [];
  const LANES = 5; let live = false, last = 0, since = 0, missNeed = 0;
  const need = () => words[built];
  const glow = () => { const h = helpOn(); ufos.forEach(u => { u.el.classList.toggle('nexthint', h && u.word === need()); u.el.classList.toggle('dim', h && !words.includes(u.word)); }); };
  const drawAns = () => { $('#ansLine').innerHTML = words.map((w,k) => k < built ? `<span class="tile ok">${esc(w)}</span>` : '<span class="tile ghost">?</span>').join(''); glow(); };
  HELP_HOOK = () => { $('#hintRow').style.display = ''; glow(); say(text); };
  const spawn = () => {
    const used = ufos.map(u => u.lane), free = [...Array(LANES).keys()].filter(l => !used.includes(l));
    if(!free.length) return;
    const onScreen = ufos.some(u => u.word === need());
    let w;
    if(!onScreen && (missNeed >= 1 || Math.random() < (helpOn() ? .75 : .5))){ w = need(); missNeed = 0; }
    else { const pool = cards.filter(x => x !== need() && !ufos.some(u => u.word === x)); w = pool.length ? sample(pool,1)[0] : need(); if(!onScreen) missNeed++; }
    const lane = sample(free,1)[0], el = document.createElement('div');
    el.className = 'ufo'; el.innerHTML = `<span class="en">${esc(w)}</span>`;
    el.style.left = (lane * 20 + 10) + '%';
    ar.appendChild(el);
    ufos.push({el, word:w, lane, y:-70});
    glow();
  };
  const fire = x => {
    const el = document.createElement('div'); el.className = 'shot'; ar.appendChild(el);
    shots.push({el, x, y:ar.clientHeight - 70});
    tone([900,1300], .05, 'square', .04);
  };
  ar.addEventListener('pointerdown', e => {
    if(!live || S.solved || Date.now() < LOCK_UNTIL) return;
    const r = ar.getBoundingClientRect(), x = Math.max(24, Math.min(r.width - 24, e.clientX - r.left));
    plane.style.left = x + 'px'; fire(x);
  });
  const hit = (u, k) => {
    ufos.splice(k, 1);
    if(u.word === need()){
      built++; sfxPop(); u.el.classList.add('boom'); setTimeout(() => u.el.remove(), 350); drawAns();
      if(built === words.length){
        live = false;
        const sec = (Date.now() - T0) / 1000, fast = S.tries === 0 && sec <= 35;
        say(text); correct(text, `<div style="font-size:17px">⏱️ ${Math.round(sec)}초</div>`, fast ? {bonus:5, bonusLabel:'⚡ 스피드 보너스'} : {});
      }
    } else {
      u.el.classList.add('bad'); setTimeout(() => u.el.remove(), 350);
      const trap = !words.includes(u.word);
      wrong(trap ? `<b class="en">${esc(u.word)}</b> UFO는 함정이에요!` : `<b class="en">${esc(u.word)}</b>는 아직 차례가 아니에요. ${built ? '초록 단어 다음에 올 단어는?' : '첫 단어를 찾아요!'}`);
      if(S.tries >= 2) $('#hintRow').style.display = '';
    }
  };
  const loop = t => {
    if(S.solved || VIEW !== 'play' || !ar.isConnected) return;
    const dt = last ? Math.min(.05, (t - last) / 1000) : 0; last = t;
    const H = ar.clientHeight, W = ar.clientWidth, sp = (H + 70) / (helpOn() ? 16 : Math.max(10, 13 - q.r * .4));
    since += dt * 1000;
    if(since > (helpOn() ? 1700 : 1200)){ since = 0; spawn(); }
    for(let k = ufos.length - 1; k >= 0; k--){
      const u = ufos[k]; u.y += sp * dt; u.el.style.top = u.y + 'px';
      if(u.y > H){ u.el.remove(); ufos.splice(k, 1); }
    }
    for(let j = shots.length - 1; j >= 0; j--){
      const s = shots[j]; s.y -= 760 * dt; s.el.style.left = s.x + 'px'; s.el.style.top = s.y + 'px';
      let gone = s.y < -30;
      if(!gone && Date.now() >= LOCK_UNTIL){
        for(let k = ufos.length - 1; k >= 0; k--){
          const u = ufos[k], cx = (u.lane * 20 + 10) / 100 * W, half = u.el.offsetWidth / 2;
          if(Math.abs(s.x - cx) <= half && s.y <= u.y + u.el.offsetHeight && s.y >= u.y - 10){ hit(u, k); gone = true; break; }
        }
      }
      if(gone){ s.el.remove(); shots.splice(j, 1); }
    }
    requestAnimationFrame(loop);
  };
  if(!S.solved){ $('#arena').scrollIntoView({behavior:'smooth', block:'end'}); countdown(() => { live = true; T0 = Date.now(); spawn(); requestAnimationFrame(loop); }); }
}

/* ===================== 스피드 챌린지 (빨리 끝낸 친구용) ===================== */
let ATK = null;
function atkPool(){
  const P = [];

  ACTIONS.forEach(a => {
    P.push({key:'pa:'+a.id, q:'그림에 맞는 완벽한 문장은?', prompt:() => `<div class="qbox">${actPic(a.id)}</div>`, ans:a.full, mk:() => opts2x2(a.full, sample(ACTIONS.filter(x => x.id !== a.id), 1)[0].full, 'any')});
    P.push({key:'ha:'+a.id, q:'들리는 문장을 골라요!', prompt:() => '<div class="big-emoji">🔊</div>', say:a.full, ans:a.full, mk:() => opts3(a.full, sample(ACTIONS.filter(x => x.id !== a.id), 3).map(x => x.full))});
    const sp = [a.dbl ? a.base + 'ing' : a.base.endsWith('e') ? a.base + 'ing' : a.base + a.base.slice(-1) + 'ing', a.ing.replace('i','e'), a.ing.slice(0,-3) + 'ign', a.base + 'eing'];
    P.push({key:'sp:'+a.id, q:'철자가 맞는 단어는?', prompt:() => `<div class="qbox">${actPic(a.id)}<div class="sentence en" style="margin:0">I'm ____${rest(a)}.</div></div>`, ans:a.ing, mk:() => opts3(a.ing, shuffle(sp))});
    P.push({key:'pu:'+a.id, q:'바르게 쓴 문장은? (대문자·문장부호)', prompt:() => '<div class="big-emoji">✍️</div>', ans:a.full, mk:() => opts3(a.full, shuffle([`i'm ${a.ing}${rest(a)}.`, `I'm ${a.ing}${rest(a)}`, `Im ${a.ing}${rest(a)}.`, `I'm ${a.ing}${rest(a)}?`]))});
  });
  HE_ACTS.forEach(id => ['he','she'].forEach(w => {
    const a = act(id), ans = ansText(id, w);
    P.push({key:'ph:'+id+w, q:'이 친구가 하는 일을 바르게 말한 문장은?', prompt:() => `<div class="qbox">${hPic(id, w)}</div>`, ans, mk:() => opts2x2(ans, Math.random() < .5 ? ansText(id, w === 'he' ? 'she' : 'he') : ansText(sample(HE_ACTS.filter(x => x !== id), 1)[0], w), 'any')});
    P.push({key:'hh:'+id+w, q:'들리는 문장을 골라요!', prompt:() => '<div class="big-emoji">🔊</div>', say:ans, ans, mk:() => { const b = sample(HE_ACTS.filter(x => x !== id), 1)[0]; return shuffle([ans, ansText(id, w === 'he' ? 'she' : 'he'), ansText(b, 'he'), ansText(b, 'she')]); }});
  }));

function atkItem(){

function sfxFunny(){

    } else if(k === 1){

        const o = ACTX.createOscillator(), g = ACTX.createGain(), lp = ACTX.createBiquadFilter();

        if(len > .5){ const l = ACTX.createOscillator(), lg = ACTX.createGain(); l.frequency.value = 7; lg.gain.value = 12; l.connect(lg); lg.connect(o.frequency); l.start(t + d); l.stop(t + d + len); }
        g.gain.setValueAtTime(.0001, t + d); g.gain.linearRampToValueAtTime(.5, t + d + .03); g.gain.exponentialRampToValueAtTime(.001, t + d + len);
        o.connect(lp); lp.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + len + .02);
      });
    } else {
      [0,.18].forEach(d => { const o = ACTX.createOscillator(), g = ACTX.createGain(); o.type = 'square';
        o.frequency.setValueAtTime(620, t + d); o.frequency.exponentialRampToValueAtTime(230, t + d + .14);
