        <div class="center" style="margin-top:10px"><button class="green" id="goStage" style="font-size:24px;padding:14px 30px">🌟 무대에 올라가기</button></div></div>
      <div class="panel"><h2>👗 마지막 옷 고르기 <small class="muted" style="font-size:16px">내가 산 아이템만 입을 수 있어요</small></h2>
        ${owned.length ? `<div class="items">${owned.map(x => `<button class="item own ${S.eq[x.slot]===x.id?'on':''}" data-item="${x.id}">${x.set?`<span class="setb">${SETS[x.set].em}</span>`:''}<span class="ic">${itemIcon(x)}</span>${x.name}<span class="pr">${S.eq[x.slot]===x.id?'입는 중 ✓':'입기'}</span></button>`).join('')}</div>`
          : '<p style="font-size:20px">아직 산 아이템이 없어요. 그래도 멋지게 무대에 올라가요! 😊</p>'}
      </div></div>`;
    $$('[data-item]').forEach(b => b.onclick = () => { const x = itemById(b.dataset.item); if(S.eq[x.slot] === x.id) delete S.eq[x.slot]; else S.eq[x.slot] = x.id; save(); renderDresser(); });
    const fs = $('#finalShop'); if(fs) fs.onclick = startFinalShop;
    $('#goStage').onclick = () => { S.onStage = true; save(); sfxBuy(); confetti(); renderDresser(); };
    return;
  }
  // 2단계: 무대 — 친구들이 별 버튼을 1초 꾹 누르면 별이 생겨요
  const sc = styleScore(S.eq);
  $('#app').innerHTML = `<div class="dresser">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="stage-av">${avatarSVG(S.eq, S.hero.style)}</div>
      </div>
      <div class="nameplate"><b>${esc(S.hero.name || '주인공')}</b> · ${styleTitle(sc)}</div>
    </div>
    <div class="vote-panel">
      <div class="star-secret">⭐ 별이 몇 개일까요?<small>마지막에 공개해요!</small></div>
      <p class="vote-how">멋지다고 생각하면<br><b>⭐ 버튼을 1초 동안 꾹</b> 눌러 주세요!</p>
      <button class="hold-btn" id="holdBtn" aria-label="별 주기 (1초 꾹 누르기)">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="ring-bg"/><circle cx="60" cy="60" r="54" class="ring" id="ring"/></svg>
        <span class="hb-star">⭐</span><span class="hb-txt" id="holdTxt">꾹 누르기</span>
      </button>
      <div class="vote-msg" id="voteMsg">&nbsp;</div>
      <button class="count-btn" id="countBtn">⭐ 별 세어 보기</button>
      <div class="teacher-row"><button class="sec small" id="leaveStage">← 무대에서 내려오기</button></div>
    </div></div>`;
  const btn = $('#holdBtn'), ring = $('#ring'), txt = $('#holdTxt'), C = 2 * Math.PI * 54;
  ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C;
  let t0 = 0, raf = 0, holding = false, needRelease = false;
  const reset = () => { holding = false; cancelAnimationFrame(raf); ring.style.strokeDashoffset = C; btn.classList.remove('holding'); txt.textContent = '꾹 누르기'; };
  const tick = () => {
    if(!holding) return;
    const p = Math.min(1, (performance.now() - t0) / 1000);
    ring.style.strokeDashoffset = C * (1 - p);
    if(p >= 1){ holding = false; needRelease = true; btn.classList.remove('holding'); btn.classList.add('done'); addStar(); txt.textContent = '손을 떼요'; return; }
    raf = requestAnimationFrame(tick);
  };
  const down = e => {
    e.preventDefault();
    if(needRelease || holding) return;
    holding = true; t0 = performance.now(); btn.classList.add('holding'); txt.textContent = '조금만 더…';
    tone([440],.05,'triangle',.06); raf = requestAnimationFrame(tick);
  };
  const up = () => {
    if(holding && performance.now() - t0 < 1000) $('#voteMsg').textContent = '1초 동안 꾹 눌러야 별이 생겨요!';
    needRelease = false; btn.classList.remove('done'); reset();
  };
  btn.addEventListener('pointerdown', down);
  ['pointerup','pointercancel','pointerleave'].forEach(ev => btn.addEventListener(ev, up));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  function addStar(){
    let x, y; for(let k=0;k<30;k++){ x = 4 + Math.random()*88; y = 4 + Math.random()*84; if(!(x > 28 && x < 72 && y > 8 && y < 92)) break; }
    const v = {x:+x.toFixed(1), y:+y.toFixed(1), s:28 + Math.floor(Math.random()*22), r:Math.floor(Math.random()*50) - 25};
    S.votes.push(v); save();
    const st = $('#stage'), el = document.createElement('span');
    el.className = 'vstar flash'; el.textContent = '⭐';
    el.style.left = v.x + '%'; el.style.top = v.y + '%'; el.style.fontSize = v.s + 'px'; el.style.setProperty('--r', v.r + 'deg');
    st.appendChild(el);
    const pl = document.createElement('span'); pl.className = 'plus1'; pl.textContent = '+1'; pl.style.left = v.x + '%'; pl.style.top = v.y + '%'; st.appendChild(pl);
    setTimeout(() => pl.remove(), 1100); setTimeout(() => el.remove(), 1600);
    tone([988,1319,1760],.07,'triangle',.16);
    if(S.votes.length % 5 === 0) confetti();
    $('#voteMsg').textContent = sample(['별을 줘서 고마워요! 💖','반짝반짝! ✨','최고예요! 🌟','고마워요! 😊'],1)[0];
  }
  $('#leaveStage').onclick = () => modal('무대에서 내려갈까요?<br><small class="muted">받은 별은 그대로 남아 있어요.</small>', '내려가기', '아니요', () => { if(!S.votes.length) S.onStage = false; save(); go(PREV && PREV !== 'dresser' ? PREV : 'map'); });
  $('#countBtn').onclick = () => {
    const cb = $('#countBtn'); if(cb.disabled) return;
    const stage = $('#stage'), n = S.votes.length;
    $$('#stage .vstar').forEach(x => x.remove());
    const stars = S.votes.map(v => { const e = document.createElement('span'); e.className = 'vstar hid'; e.textContent = '⭐'; e.style.left = v.x + '%'; e.style.top = v.y + '%'; e.style.fontSize = v.s + 'px'; e.style.setProperty('--r', v.r + 'deg'); stage.appendChild(e); return e; });
    $$('#stage .count-ov').forEach(x => x.remove());
    const ov = document.createElement('div'); ov.className = 'count-ov'; ov.innerHTML = '<span id="cnum">0</span>'; stage.appendChild(ov);
    if(!n){ ov.innerHTML = '<span class="small">아직 별이 없어요</span>'; setTimeout(() => ov.remove(), 1800); return; }
    cb.disabled = true; btn.disabled = true;
    const gap = Math.max(120, Math.min(380, 5000 / n));
    let k = 0;
    const step = () => {
      if(!$('#cnum')) return;
      if(k < n){
        stars[k].classList.remove('hid'); stars[k].classList.add('counted'); k++;
        $('#cnum').textContent = k; $('#cnum').classList.remove('bump'); void $('#cnum').offsetWidth; $('#cnum').classList.add('bump');
        tone([523 * Math.pow(2, Math.min(k, 24) / 12)], .07, 'triangle', .14);
        setTimeout(step, gap);
      } else {
        ov.innerHTML = `<span class="final">⭐ 총 ${n}개!</span>`;
        tone([784,988,1319,1568],.12,'triangle',.18); confetti();
        cb.disabled = false; cb.textContent = '⭐ 다시 세어 보기'; btn.disabled = false;
      }
    };
    setTimeout(step, 300);
  };
}

/* ===================== 결과: 파티 도착 ===================== */
function renderEnd(){
  const sk = {listen:[0,0], read:[0,0], speak:[0,0], write:[0,0]};
  STAGES.forEach((st,i) => { const r = S.stats[i]; if(r){ sk[st.skill][0] += r.first; sk[st.skill][1] += r.n; } });
  const pct = ([f,n]) => n ? Math.round(f / n * 100) + '%' : '-';
  const mm = Math.floor(S.elapsed / 60), ss = S.elapsed % 60;
  const sc = styleScore(S.eq), totalStars = Object.values(S.stars).reduce((a,b) => a + b, 0);
  const reacts = ['와, 정말 멋지다!','그 옷 어디서 샀어?','오늘 파티의 주인공이네!','반짝반짝 빛나!','나도 그거 갖고 싶어!','같이 사진 찍자!'];
  const d = new Date();
  $('#app').innerHTML = topbar() + `<div class="panel cert center">
    <div class="atk-banner"><div><b>모든 미션 끝! 시간이 남았나요?</b><br>90초 동안 문제를 풀고 코인을 더 모아요.</div><button class="atk-big" id="atkBtn">⚡ 스피드 챌린지 시작</button></div>
    <div class="big-emoji">${EP[ep()].em}🏆🎈</div><h1>${EP[ep()].cert}</h1>
    <p style="font-size:22px"><b>${esc(S.hero.name || '주인공')}</b>, ${EP[ep()].name}의 모든 미션을 해냈어요!</p>
    <div class="av-wrap" style="width:200px;margin:8px auto">${avatarSVG(Object.assign({bg: ep() === 2 ? 'bg_fun' : 'bg_party'}, S.eq), S.hero.style)}</div>
    <div style="font-size:24px">✨ ${ep()===2?'':'파티 '}스타일 점수 <b>${sc}점</b> · <b>${styleTitle(sc)}</b></div>
    <div>${(rs => sample(NAMES,3).map((n,k) => `<span class="reaction">${nameFace(n)} ${rs[k]}</span>`).join(''))(sample(reacts,3))}</div>
    <table>
      <tr><td>⭐ 모은 별</td><td>${totalStars} / ${STAGES.length * 3}</td></tr>
      <tr><td>🎧 듣기 · 한 번에 맞힌 비율</td><td>${pct(sk.listen)}</td></tr>
      <tr><td>📖 읽기 · 한 번에 맞힌 비율</td><td>${pct(sk.read)}</td></tr>
      <tr><td>🎤 말하기 · 한 번에 성공한 비율</td><td>${pct(sk.speak)}</td></tr>
      <tr><td>✏️ 쓰기 · 한 번에 맞힌 비율</td><td>${pct(sk.write)}</td></tr>
      <tr><td>⏱️ 문제 푸는 데 걸린 시간</td><td>${mm}분 ${ss}초</td></tr>
      <tr><td>⚡ 스피드 챌린지 최고 기록</td><td>${S.bestAttack || 0}점</td></tr>
      <tr><td>👗 모은 아이템 / 완성한 세트</td><td>${S.owned.length}개 / ${S.setsDone.length}세트</td></tr>
      <tr><td>🎙️ 말하기 방식</td><td style="font-size:16px">${MODE_NOTE[detectMode()].replace(/\(.*\)/,'')}</td></tr>
    </table>
    <p style="font-size:18px">⏰ 시간이 남았나요? <b>⚡ 스피드 챌린지</b>로 코인을 더 모아 아이템을 사요! (상점은 미션을 깰 때 열려요)</p>
    <p class="muted" style="font-size:16px">${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} · 이 화면을 선생님께 보여 주세요 😊</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${S.shopAvail ? `<button class="blue" data-go="shop">🛍️ ${ep()===2?'':'파티 전에 '}마지막 꾸미기 (2분)</button>` : ''}
      <button class="dresser-btn" id="dresserBtn">🌟 베스트 드레서 무대</button>
      <button class="sec" id="again">🔁 한 번 더 도전 (아이템은 그대로, 더 많이 모으기!)</button>
    </div></div>`;
  $('#atkBtn').onclick = startAttack;
  $('#dresserBtn').onclick = goDresser;
  $('#again').onclick = () => modal('처음 미션부터 다시 도전할까요?<br><small class="muted">코인과 아이템은 그대로예요. 못 모은 아이템과 세트를 모아 봐요!</small>', '다시 도전!', '아니요', () => {
    S.stage = 0; S.q = 0; S.list = buildStage(0); S.tries = 0; S.solved = false; S.stats = {}; S.stars = {}; S.elapsed = 0;
    S.shopAvail = false; S.shopUntil = null; S.combo = 0; S.round = (S.round || 1) + 1;
    save(); go('map');
  });
}

/* ===================== 소리·마이크 점검 ===================== */
function renderCheck(){
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const iosNotSafari = isIOS && /CriOS|FxiOS|EdgiOS|Whale|NAVER|KAKAO/i.test(ua);
  const whale = /Whale/i.test(ua);
  const notes = [];
  if(!micPolicyOK()) notes.push('⚠️ 지금 이 화면(링크)에서는 <b>마이크가 막혀 있어요.</b> 말하기 미션은 "따라 말하기" 방식으로만 진행돼요. 자동 채점을 쓰려면 선생님이 이 앱 파일을 학교 홈페이지·웹 호스팅에 올려서 그 주소로 열어 주세요.');
  if(iosNotSafari) notes.push('⚠️ 아이패드·아이폰은 <b>Safari</b>로 열어야 음성 인식이 돼요.');
  if(whale) notes.push('ℹ️ 웨일 브라우저예요. 음성 인식 테스트가 실패하면 <b>크롬(Chrome)</b>으로 열어 보세요.');
  const fromStart = PREV === 'start';
  const keep = () => { if(!fromStart) save(); };
  $('#app').innerHTML = (!fromStart ? topbar() : '') + `<div class="panel">
    <h2>🔧 소리·마이크 점검</h2>
    <p class="muted" style="font-size:17px">선생님이나 학생이 미션 시작 전에 한 번 눌러 보세요. 결과에 맞게 말하기 미션 방식이 자동으로 정해져요.</p>
    ${notes.map(n => `<div class="feedback info" style="text-align:left;font-size:18px;margin:8px 0">${n}</div>`).join('')}
    <div class="chk"><span class="st" id="st1">❔</span><div>① 원어민 소리 (스피커/이어폰)<small id="m1">버튼을 누르면 영어 문장이 나와요.</small></div><button class="small" id="t1">🔊 듣기</button></div>
    <div class="chk"><span class="st" id="st2">❔</span><div>② 음성 인식 (자동 채점)<small id="m2">${SR ? '버튼을 누르고 "Hello, I\'m reading a book." 이라고 말해요.' : '이 브라우저는 음성 인식 기능이 없어요.'}</small></div><button class="small" id="t2" ${SR && micPolicyOK() ? '' : 'disabled'}>🎤 테스트</button></div>
    <div class="chk"><span class="st" id="st3">❔</span><div>③ 녹음하고 다시 듣기<small id="m3">${canRecord() ? '버튼을 누르고 3초 동안 아무 말이나 해요.' : '이 화면에서는 녹음을 쓸 수 없어요.'}</small></div><button class="small" id="t3" ${canRecord() ? '' : 'disabled'}>🔴 3초 녹음</button></div>
    <div class="feedback info" id="sum" style="font-size:19px"></div>
    <div class="center" style="margin-top:14px"><button id="done">${fromStart ? '시작 화면으로 ▶' : '돌아가기 ▶'}</button></div></div>`;
  if(!SR || !micPolicyOK()) $('#st2').textContent = '❌';
  if(!canRecord()) $('#st3').textContent = '❌';
  const sum = () => { $('#sum').innerHTML = `이 기기에서 말하기 미션은 → <b>${MODE_NOTE[detectMode()]}</b>`; };
  sum();
  $('#t1').onclick = async () => {
    if(!('speechSynthesis' in window)){ $('#st1').textContent = '❌'; $('#m1').textContent = '이 브라우저는 영어 읽어주기를 지원하지 않아요.'; return; }
    pickVoice(); $('#m1').textContent = '재생 중…';
    await say("Hello! What are you doing? I'm reading a book.");
    $('#st1').textContent = VOICE ? '✅' : '⚠️';
    $('#m1').innerHTML = VOICE ? `목소리: ${esc(VOICE.name)} · 소리가 들렸다면 OK!` : '영어 목소리를 찾지 못했어요. 소리가 이상하면 다른 브라우저를 써 보세요.';
  };
  $('#t2').onclick = () => {
    stopListening();
    let r; try{ r = new SR(); }catch(e){ $('#st2').textContent = '❌'; return; }
    REC = r; r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 1;
    let got = '', err = null;
    $('#st2').textContent = '👂'; $('#m2').textContent = '듣고 있어요… 말하세요!';
    r.onresult = e => { got = e.results[0][0].transcript; };
    r.onerror = e => { err = e.error; };
    r.onend = () => {
      REC = null;
      if(got){ $('#st2').textContent = '✅'; $('#m2').innerHTML = `들린 말: <span class="en">"${esc(got)}"</span> → 자동 채점 가능!`; S.speechMode = 'auto'; }
      else if(err === 'no-speech' || !err){ $('#st2').textContent = '⚠️'; $('#m2').textContent = '소리가 안 들렸어요. 마이크 가까이에서 다시 해 보세요.'; }
      else {
        $('#st2').textContent = '❌';
        $('#m2').textContent = {'not-allowed':'마이크 허용을 거절했거나 막혀 있어요. 주소창 옆 🔒에서 마이크를 "허용"으로 바꿔 주세요.','service-not-allowed':'이 브라우저에서는 음성 인식을 쓸 수 없어요. (아이패드는 Safari, 그 외에는 Chrome 권장)','network':'음성 인식 서버에 연결할 수 없어요. 인터넷 연결 또는 브라우저(Chrome 권장)를 확인하세요.','audio-capture':'마이크를 찾을 수 없어요.'}[err] || ('오류: ' + err);
        S.speechMode = canRecord() ? 'record' : 'none';
      }
      keep(); sum();
    };
    try{ r.start(); }catch(e){ $('#st2').textContent = '❌'; }
    setTimeout(() => { try{ r.stop(); }catch(e){} }, 7000);
  };
  $('#t3').onclick = async () => {
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks = []; const mr = new MediaRecorder(stream);
      mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const au = new Audio(URL.createObjectURL(new Blob(chunks, {type: mr.mimeType || 'audio/webm'})));
        au.play().catch(()=>{});
        $('#st3').textContent = '✅'; $('#m3').textContent = '녹음한 소리가 들렸다면 OK! (자동 채점이 안 되면 이 방식으로 진행돼요)';
        if(S.speechMode !== 'auto'){ S.speechMode = 'record'; } keep(); sum();
      };
      mr.start(); $('#st3').textContent = '🔴'; $('#m3').textContent = '녹음 중… (3초)';
      setTimeout(() => mr.stop(), 3000);
    }catch(e){
      $('#st3').textContent = '❌'; $('#m3').textContent = '마이크를 쓸 수 없어요. 마이크 권한을 확인해 주세요.';
      if(S.speechMode !== 'auto'){ S.speechMode = 'none'; keep(); } sum();
    }
  };
  $('#done').onclick = () => { stopListening(); if(fromStart){ VIEW = 'start'; render(); } else go(PREV && PREV !== 'check' ? PREV : 'map'); };
}


/* ===================== 시작 ===================== */
S = load();
if(S && S.hero){
  applyEp();
  VIEW = S.onStage ? 'dresser' : 'map';
  if(S.finalMode && !(S.shopUntil > Date.now())){ S.finalMode = false; S.shopAvail = false; S.shopUntil = null; VIEW = 'dresser'; save(); }
  if(S.shopAvail){
    if(!S.shopUntil && S.lastCleared != null) VIEW = 'clear';
    else if(S.shopUntil > Date.now()) VIEW = 'shop';
    else { S.shopAvail = false; S.shopUntil = null; save(); }
  }
} else { S = null; VIEW = 'start'; }
render();
</script>
</body>
</html>
